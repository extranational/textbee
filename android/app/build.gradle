plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigning = [
    storeFile    : System.getenv('TEXTBEE_RELEASE_STORE_FILE'),
    storePassword: System.getenv('TEXTBEE_RELEASE_STORE_PASSWORD'),
    keyAlias     : System.getenv('TEXTBEE_RELEASE_KEY_ALIAS'),
    keyPassword  : System.getenv('TEXTBEE_RELEASE_KEY_PASSWORD')
]

def missingReleaseSigningVariables = {
    releaseSigning.findAll { entry ->
        entry.value == null || entry.value.trim().isEmpty()
    }.keySet()
}

android {
    namespace "com.viewridgesecurity.smsgateway"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "2.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        javaCompileOptions {
//            annotationProcessorOptions {
//                arguments["room.schemaLocation"] = "$projectDir/schemas"
//            }
//        }
    }
    signingConfigs {
        productionRelease {
            // Leave the configuration incomplete during IDE sync and debug builds.
            // The task-graph check below fails any prodRelease build explicitly.
            if (missingReleaseSigningVariables().isEmpty()) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    flavorDimensions "environment"
    
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.viewridgesecurity.smsgateway.dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.textbee.dev/api/v1/"'
            buildConfigField "String", "ENVIRONMENT", '"development"'
            resValue "string", "app_name", "textbee.dev (Dev)"
        }
        
        prod {
            dimension "environment"
            applicationId "com.viewridgesecurity.smsgateway"
            signingConfig signingConfigs.productionRelease
            buildConfigField "String", "API_BASE_URL", '"https://sms.viewridgesecurity.com/api/v1/"'
            buildConfigField "String", "ENVIRONMENT", '"production"'
            resValue "string", "app_name", "textbee.dev"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.8'
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildsProdRelease = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase(Locale.ROOT).contains('prodrelease')
    }

    if (buildsProdRelease) {
        def missingVariables = missingReleaseSigningVariables()
        if (!missingVariables.isEmpty()) {
            def environmentNames = [
                storeFile    : 'TEXTBEE_RELEASE_STORE_FILE',
                storePassword: 'TEXTBEE_RELEASE_STORE_PASSWORD',
                keyAlias     : 'TEXTBEE_RELEASE_KEY_ALIAS',
                keyPassword  : 'TEXTBEE_RELEASE_KEY_PASSWORD'
            ]
            def missingEnvironmentNames = missingVariables.collect { environmentNames[it] }.sort()
            throw new GradleException(
                "Production release signing is not configured. Missing environment variables: " +
                    missingEnvironmentNames.join(', ')
            )
        }

        def releaseStoreFile = file(releaseSigning.storeFile)
        if (!releaseStoreFile.isFile()) {
            throw new GradleException(
                "Production release keystore does not exist or is not a file: ${releaseStoreFile}"
            )
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation platform('com.google.firebase:firebase-bom:29.2.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    implementation 'androidx.work:work-runtime:2.7.1'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose integration
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.navigation:navigation-compose:2.7.2'

    // Coroutines + Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

//    def room_version = "2.4.2"
//    implementation "androidx.room:room-runtime:$room_version"
//    annotationProcessor "androidx.room:room-compiler:$room_version"
}

