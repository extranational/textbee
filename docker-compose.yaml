services:
  textbee-db:
    container_name: textbee-db
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in the project-root .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in the project-root .env}
      MONGO_INITDB_DATABASE: textbee
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER in the project-root .env}
      MONGO_APP_PASS: ${MONGO_APP_PASS:?Set MONGO_APP_PASS in the project-root .env}
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongo-init-app-user.sh:/docker-entrypoint-initdb.d/10-textbee-app-user.sh:ro
    networks:
      - textbee-backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  textbee-redis:
    container_name: textbee-redis
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the project-root .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - textbee-backend
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  textbee-api:
    container_name: textbee-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_BIND_PORT:-3001}:3001"
    env_file:
      - ./api/.env
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project-root .env}
      MONGO_URI: mongodb://${MONGO_APP_USER:?Set MONGO_APP_USER in the project-root .env}:${MONGO_APP_PASS:?Set MONGO_APP_PASS in the project-root .env}@textbee-db:27017/textbee?authSource=textbee
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the project-root .env}@textbee-redis:6379
    depends_on:
      textbee-db:
        condition: service_healthy
      textbee-redis:
        condition: service_healthy
    networks:
      - textbee-frontend
      - textbee-backend

  textbee-web:
    container_name: textbee-web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    env_file:
      - ./web/.env
    environment:
      PORT: "3000"
    depends_on:
      - textbee-api
    networks:
      - textbee-frontend

networks:
  textbee-frontend:
    driver: bridge
  textbee-backend:
    driver: bridge
    internal: true

volumes:
  mongodb_data:
  redis_data:
